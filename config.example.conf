# </>SimpleCoder configuration
# Lines are `key = value`. '#' starts a comment. Values may be quoted;
# inside quotes the escapes \n \t \" \\ apply. The environment
# variables OPENAI_BASE_URL, OPENAI_API_KEY and MODEL override these.

# Required: OpenAI-compatible API base URL (include the /v1 suffix).
base_url = http://localhost:8080/v1

# Model name. Many local servers accept any string or ignore it.
model = local-model

# API key. Usually unused for local servers; leave empty.
api_key =

# Sampling temperature.
temperature = 0.7

# Context window size in tokens, used for the context-usage indicator in
# the status bar. Leave 0 to auto-detect from the server (llama.cpp
# /props or vLLM /v1/models); set explicitly if detection fails.
context_size = 0

# Auto-compaction: when context usage passes this fraction of the window
# after a turn, the conversation is summarized automatically (like
# /compact) to free up room. Needs a known context_size. Set auto_compact
# = false to disable.
auto_compact = true
auto_compact_threshold = 0.85

# Max size in bytes of an @image attachment. Oversized images are rejected (the
# turn isn't sent) rather than truncated. Default 10 MB; 0 = no limit.
max_image_bytes = 10485760

# Max model round-trips in one tool loop before giving up (bounds a runaway
# request->tool->re-request cycle). Each round may run several tool calls.
max_tool_iterations = 50

# System prompt. For longer, project-specific instructions create an
# AGENTS.md file instead (it takes precedence). Use \n for line breaks.
system_prompt = "You are a helpful assistant running in a terminal."

# Web access (opt-in). When false, the web_search and fetch_url tools are
# not exposed to the model at all. Enabling them allows outbound network
# requests to arbitrary hosts.
allow_web = false

# Search backend for web_search: searxng | tavily | brave.
#   searxng: search_url is a SearXNG base URL (JSON API enabled).
#   tavily:  search_url = https://api.tavily.com/search, set search_api_key.
#   brave:   search_url = https://api.search.brave.com/res/v1/web/search,
#            set search_api_key.
search_backend = searxng
search_url =
search_api_key =

# MCP (Model Context Protocol) servers. Point this at a sidecar JSON file that
# lists external tool servers; their tools are exposed to the model
# (confirm-required). The file uses the familiar shape:
#   { "mcpServers": {
#       "filesystem": { "command": "npx",
#         "args": ["-y", "@modelcontextprotocol/server-filesystem", "/data"] },
#       "git": { "command": "uvx", "args": ["mcp-server-git"] } } }
# Leave empty to disable MCP.
mcp_config =
